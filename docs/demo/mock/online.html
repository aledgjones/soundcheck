<!doctype html><html><head><meta charset="utf-8"><style>
html,body{width:390px;overflow:hidden}body{margin:0;font:17px/1.3 -apple-system,"SF Pro Text",system-ui,sans-serif;background:#f2f2f7;color:#1c1c1e;height:844px;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:14px 28px 6px;font-weight:600;font-size:15px}
.bar{display:flex;align-items:center;gap:12px;padding:8px 16px}
.bar .b{width:36px;height:36px;border-radius:18px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);display:grid;place-items:center;font-size:18px}
.banner{margin:0 16px 8px;padding:10px 14px;border-radius:12px;background:#fff4d6;color:#7a5200;font-size:14px;font-weight:500}
.banner.on{background:#e2f6e7;color:#1d6b33}
h1{font-size:32px;margin:8px 20px 4px}.sub{margin:0 20px 14px;color:#8e8e93;font-size:15px}
.card{margin:0 16px;background:#fff;border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid #e5e5ea}.row:last-child{border:0}
.c{width:24px;height:24px;border-radius:12px;border:2px solid #c7c7cc;flex:none}
.done .c{background:#34c759;border-color:#34c759;position:relative}.done .c:after{content:"✓";color:#fff;position:absolute;left:5px;top:1px;font-size:15px;font-weight:700}
.done .t{text-decoration:line-through;color:#8e8e93}.q{margin-left:auto;color:#8e8e93;font-size:15px}
.add{margin:auto 16px 34px;padding:14px 16px;border-radius:14px;background:#fff;color:#8e8e93}
</style></head><body>
<div class="status"><span>9:41</span><span>●●● ▮</span></div>
<div class="bar"><span class="b">☰</span><span style="flex:1"></span><span class="b">⋯</span></div>
<div class="banner on">Back online · synced just now</div>
<h1>Weekly shop</h1><p class="sub">6 items · shared with Sam</p>
<div class="card"><div class="row "><span class="c"></span><span class="t">Bread</span><span class="q"></span></div><div class="row "><span class="c"></span><span class="t">Eggs</span><span class="q">× 12</span></div><div class="row "><span class="c"></span><span class="t">Oat milk</span><span class="q"></span></div><div class="row "><span class="c"></span><span class="t">Lemons</span><span class="q">× 3</span></div><div class="row "><span class="c"></span><span class="t">Coffee</span><span class="q"></span></div><div class="row "><span class="c"></span><span class="t">Rice</span><span class="q"></span></div></div>
<div class="add">Add an item…</div>
</body></html>
