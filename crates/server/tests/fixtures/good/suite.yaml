soundcheck: "0.3"
platforms:
  android:
    driver: android
    device: Pixel_Tablet_API_35
    app: com.example.app
    hooks:
      guard: "true"
      seed: "echo '{\"context\": \"seeded\"}' # {scenario}"
      build-identity: "echo '{\"commit\": \"abc1234def\", \"fingerprint\": \"fp-android\"}'"
      install: "true"
      check: echo checked
      act: echo acted
    proxy:
      - { name: api, listen: 23000, upstream: 3000 }
      - { name: store, listen: 28100, upstream: https://api.example.com }
  ios:
    driver: ios
    device: iPad Pro 13-inch (M5)
    app: com.example.app
    hooks:
      guard: "true"
      seed: "echo '{\"context\": \"seeded\"}' # {scenario}"
      build-identity: "echo '{\"commit\": \"abc1234def\", \"fingerprint\": \"fp-ios\"}'"
      install: "true"
      check: echo checked
      act: echo acted
    proxy:
      - { name: api, listen: 24000, upstream: 3000 }
      - { name: store, listen: 29100, upstream: https://api.example.com }
  web:
    driver: chrome
    device: desktop
    viewport: 1440x900
    url: http://localhost:5173
    hooks:
      guard: "true"
      seed: "echo '{\"context\": \"seeded\"}' # {scenario}"
      build-identity: "echo '{\"commit\": \"abc1234def\", \"fingerprint\": \"fp-web\"}'"
      install: "true"
      serve: npm run dev
      check: echo checked
      act: echo acted
seeds: [viewer, empty]
tickets:
  url: https://example.atlassian.net/browse/{id}
