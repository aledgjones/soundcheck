soundcheck: "0.3"
platforms:
  ios:
    driver: ios
    device: iPad Pro 13-inch (M5)
    app: com.example.app
    hooks:
      guard: node hooks/data.mjs guard --platform ios
      build-identity: node hooks/build.mjs identity ios
      # A word that merely contains another platform's name isn't that name.
      install: node hooks/build.mjs install ios --skip-web-build
      check: node hooks/data.mjs --platform ios check
  # Copied from ios: one hook still says `--platform ios`.
  ios-tablet:
    driver: ios
    device: iPad Pro 13-inch (M5)
    app: com.example.app
    hooks:
      guard: node hooks/data.mjs guard --platform ios-tablet
      build-identity: node hooks/build.mjs identity ios-tablet
      install: node hooks/build.mjs install ios-tablet
      check: node hooks/data.mjs --platform ios check
  web:
    driver: chrome
    device: laptop
    app: com.example.app
    viewport: 1440x900
    url: http://localhost:43173/
    hooks:
      guard: node hooks/data.mjs guard --platform web
      build-identity: node hooks/build.mjs identity web
      install: node hooks/build.mjs install web
      check: node hooks/data.mjs --platform web check
  # Two chrome platforms on `desktop` with one profile: each launch is its own browser on a copy.
  phone-web:
    driver: chrome
    device: desktop
    viewport: 400x860
    url: http://localhost:43173/
    chrome-profile: ~/.soundcheck/chrome/example
    hooks:
      guard: "true"
      build-identity: "true"
      install: "true"
      check: "true"
  wide-web:
    driver: chrome
    device: desktop
    viewport: 1920x1080
    url: http://localhost:43173/
    chrome-profile: ~/.soundcheck/chrome/example
    hooks:
      guard: "true"
      build-identity: "true"
      install: "true"
      check: "true"
