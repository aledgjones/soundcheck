soundcheck: "0.3"
platforms:
  android:
    driver: android
    device: Pixel_Tablet_API_35
    app: com.example.app
    hooks:
      guard: "true"
      seed: "true # {scenario}"
      build-identity: "true"
      install: "true"
      check: "true"
      stack-up: "true"
    proxy:
      - { name: api, listen: 33000, device: 23000, upstream: 42000 }
      - { name: bucket, listen: 23000, upstream: 42333 }
  web:
    driver: chrome
    device: desktop
    viewport: 1440x900
    url: http://localhost:43173
    hooks:
      guard: "true"
      seed: "true # {scenario}"
      build-identity: "true"
      install: "true"
      check: "true"
    proxy:
      - { name: api, listen: 33000, device: 24000, upstream: 41000 }
seeds: [empty]
parallel: true
