[workspace]
resolver = "3"
members = ["crates/driver", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/aledgjones/soundcheck"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
axum = "0.8.9"
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
schemars = "1.2.3"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
reqwest = { version = "0.13.5", default-features = false }
thiserror = "2.0.21"
base64 = "0.22"
chromiumoxide = "0.9.1"
futures = "0.3"
